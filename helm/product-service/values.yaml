imagePullSecret: ghcr-pull-secret

replicaCount: 1

image:
  repository: ghcr.io/gamal0909/product-service
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

resources:
  requests:
    memory: "256Mi"
    cpu: "500m"
  limits:
    memory: "512Mi"
    cpu: "1500m"

hpa:
  minReplicas: 3
  maxReplicas: 10
  cpuUtilization: 80
