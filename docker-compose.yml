services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - my-private-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  product-service:
    build:
      context: ./app/product-service-java
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    networks:
      - my-private-network
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cart-service:
    build:
      context: ./app/cart-service-node
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "8082:8082"
    networks:
      - my-private-network
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  
  inventory-service:
    build:
      context: ./app/inventory-service-go
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8083:8083"
    networks:
      - my-private-network
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:80"
    networks:
      - my-public-network
      - my-private-network
    depends_on:
      - product-service
      - cart-service
      - inventory-service
    restart: unless-stopped
    
volumes:
  postgres-data:
networks:
  my-private-network:
    name: my-private-network
    driver: bridge
    internal: true
  my-public-network:
    name: my-public-network
    driver: bridge
    internal: false